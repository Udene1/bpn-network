name: BPN Backend CI

on:
  push:
    paths:
      - "services/backend/**"
      - ".github/workflows/bpn-backend-ci.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/bpn-backend-ci.yml"

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript build
        run: npm run build
